[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

# Bevy is unusable unoptimised and the core is what a test iterates on, so
# dependencies are built optimised even in dev and our own crates stay fast to
# rebuild.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
